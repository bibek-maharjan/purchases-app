<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16161a">
  <title>Purchases</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <input id="search" type="search" placeholder="Search… e.g. drill india" autocomplete="off">
    <button id="viewBtn" aria-label="View">▦</button>
    <button id="menuBtn" aria-label="Menu">⋮</button>
  </header>
  <div id="count"></div>
  <main id="list"></main>
  <div id="sentinel"></div>
  <button id="addBtn" aria-label="Add">+</button>

  <dialog id="menu">
    <button id="exportBtn">Export backup (.zip)</button>
    <label class="btn">Import backup<input id="importFile" type="file" accept=".zip" hidden></label>
    <button id="closeMenu">Close</button>
  </dialog>

  <dialog id="viewMenu">
    <div class="row seg">
      <button type="button" data-mode="list">List</button>
      <button type="button" data-mode="gallery">Gallery</button>
    </div>
    <div class="row cols" id="colsRow">
      <button type="button" id="colsMinus">−</button>
      <span id="colsLabel"></span>
      <button type="button" id="colsPlus">+</button>
    </div>
    <div class="hint">Show in this view</div>
    <div id="propList"></div>
    <button id="closeView">Close</button>
  </dialog>

  <dialog id="editor">
    <form id="form" method="dialog">
      <label class="photo-pick">
        <img id="preview" alt="">
        <span id="photoHint">Tap to take photo</span>
        <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
      </label>
      <input name="title" placeholder="Item name" required>
      <div class="row">
        <input name="rate" type="number" inputmode="decimal" step="any" placeholder="Rate">
        <input name="quantity" placeholder="Quantity (e.g. 20 kg)">
      </div>
      <input name="seller" placeholder="Seller" list="sellers">
      <datalist id="sellers"></datalist>
      <div class="row date-quick">
        <button type="button" data-day="today">Today</button>
        <button type="button" data-day="yesterday">Yesterday</button>
        <button type="button" data-day="custom">Custom</button>
      </div>
      <div class="row bs-date" id="customDate" hidden>
        <select id="bsYear" aria-label="Year"></select>
        <select id="bsMonth" aria-label="Month"></select>
        <select id="bsDay" aria-label="Day"></select>
      </div>
      <div id="adDate" class="hint"></div>
      <div class="row">
        <button type="button" id="deleteBtn" class="danger">Delete</button>
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="details">
    <img id="detailsImg" alt="">
    <div id="detailsInfo"></div>
    <div class="row">
      <button type="button" id="detailsEdit">Edit</button>
      <button type="button" id="detailsClose" class="primary">Close</button>
    </div>
  </dialog>

  <dialog id="viewer"><img id="viewerImg" alt=""></dialog>

  <script src="nepali.js"></script>
  <script src="zip.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
